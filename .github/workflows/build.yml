name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check native prototype
        shell: pwsh
        run: ./scripts/build-native.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarLyrics-native-prototype-win-x64
          path: artifacts/TaskbarLyrics-Native-0.2.0-prototype-win-x64.zip
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test, build and publish
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarLyrics-win-x64
          path: artifacts/TaskbarLyrics-v0.4.0-win-x64.zip
