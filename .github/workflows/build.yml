name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check C++ application
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarLyrics-native-win-x64
          path: artifacts/TaskbarLyrics-Native-0.3.1-win-x64.zip
          if-no-files-found: error
